{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esacala de serviço</title>
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <div class="container vertical">
    <div class="row align-items-center justify-content-center">
      <!-- Exibe o mês atual -->
      <h1>{{ mes_atual }} {{ ano_atual }}</h1>
        <div class="col-6">
          <!-- tabela com a respectiva escala do mês -->
        <table class="table table-light">
          <thead>
            <tr>
              <!-- Dias da semana -->
              <th scope="col" class="col-1 dia-semana">Data</th>
              <th scope="col" class="col-1 dia-semana">Militar escalado</th>
            </tr>
          </thead>
          
          <tbody>
            {% for dia in escala %}
            <tr>
              <td class="dia-mes">{{ dia.data|date:"d/m" }}</td>
              <td class="dia-mes">{{ dia.pessoa.graduacao }} {{ dia.pessoa }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>

{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esacala de serviço</title>
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <div class="container">
    <div class="col-12">
      <div class="row">
        <!-- Exibe o mês atual -->
        <h1>{{ mes_atual }}</h1>
      </div>
      <table class="table table-light">
        <thead>
          <tr>
            <!-- Dias da semana -->
             <th scope="col" class="col-1 dia-semana">Segunda-feira</th>
             <th scope="col" class="col-1 dia-semana">Terça-feira</th>
             <th scope="col" class="col-1 dia-semana">Quarta-feira</th>
             <th scope="col" class="col-1 dia-semana">Quinta-feira</th>
             <th scope="col" class="col-1 dia-semana">Sexta-feira</th>
             <th scope="col" class="col-1 dia-semana">Sábado</th>
             <th scope="col" class="col-1 dia-semana">Domingo</th>
          </tr>
        </thead>

        <tbody>
          <!-- Exibe os dias do mês -->
          {% for semana in mes %}
            <tr>
              {% for dia in semana %}
              <!-- verifica se dia e 0 -->
                {% if dia == 0 %}
                  <td class="dia-mes"></td> 
                {% else %}
                  <td class="dia-mes">{{ dia }}</td>
                {% endif %}
              {% endfor %}
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
